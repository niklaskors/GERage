name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the running one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write # to log in to AWS via OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::833741619535:role/gerage-github-deploy
          aws-region: eu-central-1

      - run: pnpm --filter @gerage/infra run deploy:ci
